scenario: custom_room
description: Small procedural room with illustrative material parameters
frequency_hz: 2400000000  # provisional; replace with the intended study band
room:
  size_m: [10.0, 6.0, 3.0]  # x length, y width, z height (z up)
  panel:
    center_x_m: 4.65
    thickness_x_m: 0.16
    y_bounds_m: [2.2, 3.8]
    z_bounds_m: [0.0, 3.0]
materials:
  # Teaching placeholders only; these values are not validated for a real site.
  concrete_like:
    relative_permittivity: 5.31
    conductivity_s_per_m: 0.0548
    color_rgb: [0.62, 0.66, 0.71]
  panel_like:
    relative_permittivity: 3.2
    conductivity_s_per_m: 0.008
    color_rgb: [0.86, 0.50, 0.23]
antenna:
  rows: 1
  columns: 1
  pattern: iso
  polarization: V
transmitter:
  name: tx0
  position_m: [1.2, 3.0, 1.4]
  power_dbm: 23.0
receivers:
  - {name: rx0, position_m: [3.0, 3.0, 1.4]}
  - {name: rx1, position_m: [8.2, 3.0, 1.4]}
  - {name: rx2, position_m: [8.2, 5.0, 1.4]}
path_solver:
  max_depth: 2
  samples_per_source: 20000
  seed: 42
  los: true
  specular_reflection: true
  diffuse_reflection: false
  refraction: false
  diffraction: false
radio_map:
  center_m: [5.0, 3.0, 1.4]
  orientation_rad: [0.0, 0.0, 0.0]
  size_m: [10.0, 6.0]
  cell_size_m: [0.5, 0.5]
  samples_per_transmitter: 50000
  max_depth: 2
  seed: 42
