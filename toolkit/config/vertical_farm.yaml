description: Compact indoor vertical-farm software demo with configurable rack levels (artificial dimensions)
frequency_hz: 2400000000.0 # provisional demo value, not a frequency decision

environment:
  label: Indoor vertical farm
  width_m: 1.25
  depth_m: 0.65
  height_m: 2.10
  panel_thickness_m: 0.035
  floor_thickness_m: 0.06
  front_open: true
  grow_lights_enabled: true
  shelf_levels_m: [0.27, 0.87, 1.47] # shelf top surfaces; configurable placeholders
  shelf_thickness_m: 0.035
  shelf_inset_x_m: 0.10
  shelf_front_y_m: 0.08
  shelf_depth_m: 0.48
  frame_cross_section_m: 0.035
  grow_light_thickness_m: 0.025
  equipment_block_enabled: true

rf_geometry:
  plant_zone_height_m: 0.34
  plant_zone_side_inset_m: 0.10
  inter_zone_gap_m: 0.06

visual_plants:
  visualization_only: true
  in_sionna_scene: false
  crop: Compact leafy greens / lettuce-like rosettes
  seed: 31415
  columns: 5
  rows: 2
  plant_height_m: 0.42
  leaf_count_min: 11
  leaf_count_max: 15
  label: Decorative instanced leafy crops; excluded from RF geometry

materials:
  # All RF material values are arbitrary software placeholders, not measured crop/rack properties.
  floor_placeholder:
    relative_permittivity: 5.31
    conductivity_s_per_m: 0.0548
    thickness_m: 0.06
    color_rgb: [0.63, 0.65, 0.66]
    note: DEMO PLACEHOLDER; generic floor material
  enclosure_placeholder:
    relative_permittivity: 4.0
    conductivity_s_per_m: 0.02
    thickness_m: 0.035
    color_rgb: [0.64, 0.74, 0.74]
    note: DEMO PLACEHOLDER; generic enclosure panel, not a measured cabinet material
  metal_placeholder:
    relative_permittivity: 1.0
    conductivity_s_per_m: 10000.0
    thickness_m: 0.035
    color_rgb: [0.31, 0.39, 0.42]
    note: DEMO PLACEHOLDER; generic conductive rack proxy
  tray_placeholder:
    relative_permittivity: 3.0
    conductivity_s_per_m: 0.01
    thickness_m: 0.035
    color_rgb: [0.39, 0.48, 0.43]
    note: DEMO PLACEHOLDER; generic grow-tray proxy
  equipment_placeholder:
    relative_permittivity: 3.0
    conductivity_s_per_m: 0.02
    thickness_m: 0.08
    color_rgb: [0.34, 0.4, 0.43]
    note: DEMO PLACEHOLDER; generic equipment enclosure
  canopy_placeholder:
    relative_permittivity: 8.0
    conductivity_s_per_m: 0.25
    thickness_m: 0.34
    scattering_coefficient: 0.0
    xpd_coefficient: 0.0
    scattering_pattern: lambertian
    color_rgb: [0.29, 0.57, 0.31]
    note: DEMO PLACEHOLDER; coarse solid canopy proxy, not a calibrated plant model
  canopy_dense_placeholder:
    # Same box as canopy_placeholder, standing in for a fuller crop: more leaf water per volume, so a higher
    # effective permittivity and loss. Values are as arbitrary as the sparse ones, chosen only to be clearly denser.
    relative_permittivity: 15.0
    conductivity_s_per_m: 0.5
    thickness_m: 0.34
    scattering_coefficient: 0.0
    xpd_coefficient: 0.0
    scattering_pattern: lambertian
    color_rgb: [0.2, 0.45, 0.24]
    note: DEMO PLACEHOLDER; denser coarse canopy proxy, not a calibrated plant model

antenna:
  rows: 1
  columns: 1
  pattern: iso
  polarization: V

tx:
  name: TX
  position_m: [0.625, -0.28, 1.08]
  orientation_rad: [0.0, 0.0, 0.0]
  power_dbm: 23.0

receiver_grid:
  # air_gaps: one radio-map plane per level, midway through the free air above the canopy (where a sensor
  # could sit). The primary level's plane is the one shown in the 3D viewer; the others go into the zone report.
  map_planes: air_gaps
  primary_level: 2
  height_m: 1.08 # only used when map_planes is not air_gaps
  x_min_m: -0.12
  x_max_m: 1.37
  y_min_m: -0.35
  y_max_m: 0.85
  spacing_m: 0.30
  representative_receivers:
    - {name: RX_A, role: lower level front opening, position_m: [0.30, -0.05, 0.58]}
    - {name: RX_B, role: middle level front opening, position_m: [0.95, -0.05, 1.18]}
    - {name: RX_C, role: upper level front opening, position_m: [0.62, -0.05, 1.78]}

path_solver:
  max_depth: 3
  samples_per_source: 9000
  seed: 71
  los: true
  specular_reflection: true
  diffuse_reflection: false
  refraction: true
  diffraction: false

radio_map:
  cell_size_m: [0.15, 0.15]
  samples_per_transmitter: 18000
  max_depth: 3
  seed: 71
  los: true
  specular_reflection: true
  diffuse_reflection: false
  refraction: true
  diffraction: false

analysis:
  # Coverage = share of cells where TX power + path gain reaches this level. DEMO PLACEHOLDER, not a chosen radio.
  receiver_sensitivity_dbm: -90.0

run_profiles:
  # Chosen with: run.py vertical-farm --profile <name>. Without --profile the settings above are used as-is.
  # spark: from the sampling study on the DGX Spark (Oct 2026). Map values settle by ~1000x samples; averaging
  # 8 seeds at 10000x removes most remaining noise. Path samples stay lower: paths.json grows with them.
  spark:
    path_samples_multiplier: 100
    map_samples_multiplier: 10000
    map_seeds: [71, 72, 73, 74, 75, 76, 77, 78]

scenarios:
  farm_empty:
    label: Vertical farm · Empty rack
    zones_per_level: 0
    visual_plants_visible_by_default: false
    material_status: No RF canopy proxy
  farm_proxy:
    label: Vertical farm · RF plant proxy
    zones_per_level: 1
    visual_plants_visible_by_default: true
    material_status: Placeholder RF canopy proxy · one zone per level
  farm_dense:
    # Same canopy box as farm_proxy; only the canopy material is denser (canopy_dense_placeholder).
    label: Vertical farm · Dense canopy proxy
    zones_per_level: 1
    canopy_material: canopy_dense_placeholder
    visual_plants_visible_by_default: true
    material_status: Placeholder dense RF canopy proxy · one zone per level, higher-loss material
